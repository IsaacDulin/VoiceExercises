<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Voice Exercises</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <h1 id="title">Voice Exercises</h1>
  <label for="exerciseType">Exercise Type:</label>
  <select id="exerciseType" name="exerciseType">
    <option value="scale">Scale</option>
    <option value="arpeggio">Arpeggio</option>
  </select>
  <br><br>
  <label for="pitchClass">Pitch Class:</label>
  <select id="pitchClass" name="pitchClass">
    <option value="C">C</option>
    <option value="C#">C#</option>
    <option value="D">D</option>
    <option value="D#">D#</option>
    <option value="E">E</option>
    <option value="F">F</option>
    <option value="F#">F#</option>
    <option value="G">G</option>
    <option value="G#">G#</option>
    <option value="A">A</option>
    <option value="A#">A#</option>
    <option value="B">B</option>
  </select>
  <br><br>
  <label for="octaveSlider">Octave: <span id="octaveValue">0</span></label>
  <input type="range" id="octaveSlider" name="octaveSlider" min="-2" max="2" value="0">
  <br><br>
  <button id="toneButton">Play Tone</button>

  <script src="./script.js"></script>
</body>
</html>
